<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeuSite - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="brand">
            <div class="logo">◆</div>
            <h1>MeuSite</h1>
            <p>Sua plataforma, simples e poderosa.</p>
        </div>


        <div class="login-box">

            <h2>Entrar</h2>

            <p>Acesse sua conta</p>

            <input type="text" placeholder="E-mail ou Celular">

            <input type="password" placeholder="Senha">


            <button onclick="entrar()">
                Entrar
            </button>


            <p class="cadastro">
                Não possui uma conta?
                <a href="cadastro.html">
                    Cadastre-se
                </a>
            </p>

        </div>

    </div>


<script src="script.js"></script>

</body>

</html>
