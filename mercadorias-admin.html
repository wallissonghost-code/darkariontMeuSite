<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Mercadorias - Administração</title><link rel="stylesheet" href="premium.css?v=20260731-1645"><link rel="stylesheet" href="store-admin.css?v=20260731-1645"></head><body data-admin-page="true"><div class="painel"><aside class="menu"><div class="marca"><h2>WD</h2><p>FOUNDER</p></div></aside><main class="conteudo"><span class="eyebrow">GESTÃO DA LOJA</span><h1>Mercadorias</h1><p>Cadastre, edite e publique itens da vitrine.</p><section class="store-admin-card"><div class="store-admin-top"><select id="productId"><option value="">Novo produto</option></select><button id="newProduct" type="button" class="secondary-btn">Novo item</button></div><div class="image-upload"><div class="image-preview" id="imagePreview"><span>Prévia</span></div><label class="upload-btn" for="productFile">Escolher foto da galeria</label><input id="productFile" type="file" accept="image/*" hidden><small>A imagem será comprimida automaticamente.</small></div><div class="form-grid"><div><label>Nome</label><input id="productName"></div><div><label>Categoria</label><input id="productCategory" placeholder="Blusas, calças, acessórios..."></div><div><label>Selo</label><input id="productBadge" placeholder="Novo, oferta, exclusivo"></div><div><label>Preço atual</label><input id="productPrice" inputmode="decimal"></div><div><label>Preço anterior</label><input id="productOldPrice" inputmode="decimal"></div><div><label>Estoque</label><input id="productStock" type="number" min="0"></div><div><label>Ordem</label><input id="productOrder" type="number" min="1" value="1"></div><div><label>Texto do botão</label><input id="productButton" value="Ver item"></div><div><label>Link/WhatsApp</label><input id="productLink" placeholder="https://..."></div></div><label>URL alternativa da imagem</label><input id="productImage" placeholder="Opcional"><label>Descrição</label><textarea id="productDescription"></textarea><label class="check-row"><input id="productActive" type="checkbox" checked> Mostrar na vitrine</label><div class="actions"><button id="saveProduct" class="primary-btn" type="button">Salvar produto</button><button id="deleteProduct" class="danger-btn" type="button">Excluir produto</button></div><div id="productStatus" class="status"></div></section></main></div><script type="module" src="app-shell.js?v=20260731-1645"></script><script type="module" src="mercadorias-admin.js?v=20260731-1645"></script></body></html>
