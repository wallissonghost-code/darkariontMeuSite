<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Mercadorias - Administração</title><link rel="stylesheet" href="premium.css?v=20260731-1630"><link rel="stylesheet" href="store-admin.css?v=20260731-1630"></head><body data-admin-page="true"><div class="painel"><aside class="menu"><div class="marca"><h2>WD</h2><p>FOUNDER</p></div></aside><main class="conteudo"><span class="eyebrow">GESTÃO DA LOJA</span><h1>Mercadorias</h1><p>Cadastre, edite e publique itens da vitrine.</p><section class="store-admin-card"><div class="store-admin-top"><select id="productId"><option value="">Novo produto</option></select><button id="newProduct" type="button" class="secondary-btn">Novo item</button></div><div class="image-upload"><div><div class="image-preview" id="imagePreview"><span>Prévia</span></div><div class="image-thumbs" id="imageThumbs"></div></div><div><label class="upload-btn" for="productFile">Adicionar fotos da galeria</label><input id="productFile" type="file" accept="image/*" multiple hidden><small>Até 5 fotos. Arraste para o lado na vitrine.</small><button type="button" class="secondary-btn compact-btn" id="clearImages">Limpar fotos</button></div></div><div class="form-grid"><div><label>Nome</label><input id="productName"></div><div><label>Categoria</label><input id="productCategory" placeholder="Blusas, calças, acessórios..."></div><div><label>Selo</label><input id="productBadge" placeholder="Novo, oferta, exclusivo"></div><div><label>Preço atual</label><input id="productPrice" inputmode="decimal"></div><div><label>Preço anterior</label><input id="productOldPrice" inputmode="decimal"></div><div><label>Estoque</label><input id="productStock" type="number" min="0"></div><div><label>Ordem</label><input id="productOrder" type="number" min="1" value="1"></div><div><label>Texto do botão</label><input id="productButton" value="Ver detalhes"></div><div><label>WhatsApp ou link</label><input id="productLink" placeholder="Ex.: https://wa.me/5512999999999"></div></div><label>Tamanhos disponíveis</label><input id="productSizes" placeholder="Ex.: P, M, G, GG"><label>URLs adicionais de imagens</label><textarea id="productImage" placeholder="Uma URL por linha. Opcional."></textarea><label>Descrição</label><textarea id="productDescription"></textarea><label class="check-row"><input id="productActive" type="checkbox" checked> Mostrar na vitrine</label><div class="actions"><button id="saveProduct" class="primary-btn" type="button">Salvar produto</button><button id="deleteProduct" class="danger-btn" type="button">Excluir produto</button></div><div id="productStatus" class="status"></div></section></main></div><script type="module" src="app-shell.js?v=20260731-1630"></script><script type="module" src="mercadorias-admin.js?v=20260731-1630"></script></body></html>
