<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Perfil - WD Founder</title><link rel="stylesheet" href="premium.css"></head><body><div class="painel"><aside class="menu"><div class="marca"><h2>WD</h2><p>FOUNDER</p></div><a href="home.html">Início</a><a href="cartao.html">Meu Cartão</a><a href="ofertas.html">Benefícios</a><a href="perfil.html" class="ativo">Perfil</a><button onclick="sair()">Sair</button></aside><main class="conteudo"><span class="eyebrow">CONTA WD FOUNDER</span><h1>Meu perfil</h1><p>Informações vinculadas à sua experiência de fidelidade.</p><section class="perfil-card"><div class="avatar">WD</div><h2 id="perfilNome">Cliente Founder</h2><p class="email" id="perfilEmail">Conta autenticada</p><div class="nivel"><h3>Nível atual</h3><h1 id="perfilNivel">LV1</h1><span id="perfilNomeNivel">BRONZE</span></div></section></main></div><script type="module" src="app-shell.js"></script><script type="module">import{auth,db}from'./firebase.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js';const n=['BRONZE','SILVER','GOLD','PREMIUM','PLATINUM','SELECT','BLACK','ELITE','PRIME','FOUNDER'];onAuthStateChanged(auth,async u=>{if(!u)return;const s=await getDoc(doc(db,'usuarios',u.uid));const d=s.exists()?s.data():{};const v=Math.max(0,Math.min(9,Number(d.vip)||0));perfilNome.textContent=d.nome||u.displayName||'Cliente Founder';perfilEmail.textContent=u.email||'';perfilNivel.textContent='LV'+(v+1);perfilNomeNivel.textContent=n[v]});</script></body></html>
