name: Controlled Security Test

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'firestore.rules'
      - 'storage.rules'
      - 'security-test/**'
      - '.github/workflows/security-controlled-test.yml'

permissions:
  contents: read

jobs:
  security-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: security-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install security lab
        run: npm install --package-lock-only && npm ci
      - name: Run controlled security tests
        run: npm test
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-security-report
          path: security-test/reports/latest.json
          if-no-files-found: warn
