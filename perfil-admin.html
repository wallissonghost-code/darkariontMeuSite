ion value="lv6">LV6 — Select</option><option value="lv7">LV7 — Black</option><option value="lv8">LV8 — Elite</option><option value="lv9">LV9 — Prime</option><option value="lv10">LV10 — Founder</option></select><label for="adminBenefits">Benefícios</label><textarea id="adminBenefits"></textarea><button class="primary-btn" id="saveBenefits">Salvar benefícios</button><div class="status" id="adminStatus"></div></section></div></main><script type="module" src="app-shell.js?v=20260802-1130"></script><script type="module" src="admin.js?v=20260802-1130"></script></body></html>
