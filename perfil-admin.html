<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Administração - WD Founder</title><link rel="stylesheet" href="premium.css?v=20260730-2350"><style>.editor{margin-top:24px;padding:28px;background:#fffdf8;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.editor label{display:block;font-weight:800;margin:18px 0 8px}.editor select,.editor textarea,.editor input{width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit}.editor textarea{min-height:150px;resize:vertical}.editor .primary-btn{margin-top:16px}.status{margin-top:12px;color:var(--gold);font-weight:700}.client-summary{margin-top:16px;padding:18px;border-radius:16px;background:#f3ede1;border:1px solid var(--line)}.client-summary strong,.client-summary span{display:block}.client-summary span{color:var(--muted);margin-top:6px;word-break:break-word}.admin-sections{display:grid;grid-template-columns:1fr 1fr;gap:22px}.danger-btn{border:1px solid #c9857c;background:#fff5f3;color:#9b2f22;border-radius:12px;padding:10px 12px;font-weight:800;cursor:pointer}.correction-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.correction-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}@media(max-width:900px){.admin-sections{grid-template-columns:1fr}.correction-grid{grid-template-columns:1fr}}</style></head><body data-admin-page="true"><div class="painel"><aside class="menu"><div class="marca"><h2>WD</h2><p>FOUNDER</p></div><a href="home.html">Início</a><a href="cartao.html">Meu Cartão</a><a href="ofertas.html">Benefícios</a><a href="perfil.html">Perfil</a><button class="logout-btn" type="button">Sair</button></aside><main class="conteudo"><span class="eyebrow">ÁREA RESTRITA</span><h1>Administração</h1><p>Corrija contas e configure benefícios e ofertas. Vendas e histórico ficam em áreas próprias do menu.</p><div class="admin-sections"><section class="editor"><h2>Corrigir conta</h2><label for="correctionClient">Cliente</label><select id="correctionClient"><option>Carregando clientes...</option></select><div class="client-summary" id="duplicateInfo"></div><div class="correction-grid"><div><label for="correctionVip">Nível VIP</label><select id="correctionVip"><option value="0">LV0 — Membro</option><option value="1">LV1 — Bronze</option><option value="2">LV2 — Silver</option><option value="3">LV3 — Gold</option><option value="4">LV4 — Premium</option><option value="5">LV5 — Platinum</option><option value="6">LV6 — Select</option><option value="7">LV7 — Black</option><option value="8">LV8 — Elite</option><option value="9">LV9 — Prime</option><option value="10">LV10 — Founder</option></select></div><div><label for="correctionStamps">Carimbos</label><input id="correctionStamps" type="number" min="0" max="10" value="0"></div><div><label for="correctionCredits">Bônus disponível</label><input id="correctionCredits" inputmode="decimal" value="0,00"></div></div><label for="correctionReason">Motivo</label><input id="correctionReason" placeholder="Ex.: ajuste solicitado pelo cliente"><div class="correction-actions"><button class="primary-btn" id="saveCorrection">Salvar correção</button><button class="danger-btn" id="resetCustomer">Zerar progresso</button></div><div class="status" id="correctionStatus"></div></section><section class="editor"><h2>Benefícios por nível</h2><label for="adminLevel">Nível</label><select id="adminLevel"><option value="lv0">LV0 — Membro</option><option value="lv1">LV1 — Bronze</option><option value="lv2">LV2 — Silver</option><option value="lv3">LV3 — Gold</option><option value="lv4">LV4 — Premium</option><option value="lv5">LV5 — Platinum</option><option value="lv6">LV6 — Select</option><option value="lv7">LV7 — Black</option><option value="lv8">LV8 — Elite</option><option value="lv9">LV9 — Prime</option><option value="lv10">LV10 — Founder</option></select><label for="adminBenefits">Benefícios</label><textarea id="adminBenefits"></textarea><button class="primary-btn" id="saveBenefits">Salvar benefícios</button><div class="status" id="adminStatus"></div></section></div><section class="editor"><h2>Editar ofertas</h2><label for="offerId">Oferta</label><select id="offerId"><option value="oferta1">Oferta 1</option><option value="oferta2">Oferta 2</option><option value="oferta3">Oferta 3</option></select><label for="offerCategory">Categoria</label><input id="offerCategory"><label for="offerTitle">Título</label><input id="offerTitle"><label for="offerDescription">Descrição</label><textarea id="offerDescription"></textarea><label for="offerButton">Texto do botão</label><input id="offerButton"><label for="offerOrder">Ordem</label><input id="offerOrder" type="number" min="1"><button class="primary-btn" id="saveOffer">Salvar oferta</button><div class="status" id="offerStatus"></div></section></main></div><script type="module" src="app-shell.js?v=20260730-2350"></script><script type="module" src="admin.js?v=20260730-2350"></script></body></html>
