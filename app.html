  <style>
    html,body{background:#050506}
    html[data-auth-state]:not([data-auth-state="ready"]) .spa-sidebar,
    html[data-auth-state]:not([data-auth-state="ready"]) .spa-bottom-nav,
    html[data-auth-state]:not([data-auth-state="ready"]) .spa-main{visibility:hidden}
    #conteudo>.spa-view[hidden]{display:none!important}
    .spa-view[data-route="card"] .page-title:focus,
    .spa-view[data-route="card"] .page-title:focus-visible{outline:none!important;box-shadow:none!important;border-color:transparent!important}

    .spa-loader{
      position:fixed;inset:0;z-index:2147483000;display:grid;place-items:center;
      min-height:100dvh;padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
      overflow:hidden;background:
        radial-gradient(circle at 50% 48%,rgba(212,175,55,.11),transparent 29%),
        radial-gradient(circle at 50% 56%,rgba(120,86,18,.07),transparent 43%),
        #050506;color:#fff;opacity:1;visibility:visible;
      transition:opacity .16s ease,visibility .16s ease;
      -webkit-font-smoothing:antialiased
    }
    .wd-auth-ready .spa-loader,.spa-loader[hidden]{display:grid!important;opacity:0;visibility:hidden;pointer-events:none}
    .spa-loader::before{
      content:"";position:absolute;left:50%;top:50%;width:min(82vw,430px);aspect-ratio:1;
      transform:translate(-50%,-53%);border-radius:50%;background:radial-gradient(circle,rgba(221,179,57,.09),transparent 66%);
      filter:blur(22px);animation:wdSplashAura 1.9s ease-in-out infinite
    }
    .spa-loader-box{
      position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
      width:min(88vw,420px);min-height:440px;text-align:center
    }
    .wd-splash-mark{
      position:relative;width:clamp(150px,39vw,188px);aspect-ratio:1;border-radius:34%;display:grid;place-items:center;
      overflow:hidden;border:1px solid rgba(218,177,55,.42);
      background:linear-gradient(145deg,#171712 0%,#080809 48%,#12110d 100%);
      box-shadow:inset 0 1px 0 rgba(255,239,173,.16),inset 0 -22px 42px rgba(0,0,0,.42),0 0 0 1px rgba(89,67,17,.2),0 24px 72px rgba(0,0,0,.58),0 0 44px rgba(211,169,44,.12);
      animation:wdSplashEnter .42s cubic-bezier(.2,.78,.25,1) both
    }
    .wd-splash-mark::before{
      content:"";position:absolute;inset:10%;border:1px solid rgba(221,181,60,.25);border-radius:31%;transform:rotate(45deg)
    }
    .wd-splash-mark::after{
      content:"";position:absolute;top:-38%;left:-78%;width:48%;height:176%;transform:rotate(22deg);
      background:linear-gradient(90deg,transparent,rgba(255,236,157,.34),transparent);
      filter:blur(2px);animation:wdSplashShine 1.65s ease-in-out .3s infinite
    }
    .wd-splash-monogram{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:1px;color:#e8c85f;text-shadow:0 0 24px rgba(232,200,95,.28);font-size:clamp(49px,13vw,66px);font-weight:850;line-height:1;letter-spacing:.01em}
    .wd-splash-brand{margin-top:32px;color:#e5c65d;font-size:clamp(15px,4vw,18px);font-weight:850;letter-spacing:.31em;text-indent:.31em;animation:wdSplashText .42s ease .12s both}
    .wd-splash-subtitle{margin-top:10px;color:#85858a;font-size:10px;font-weight:750;letter-spacing:.28em;text-indent:.28em;text-transform:uppercase;animation:wdSplashText .42s ease .18s both}
    .wd-splash-progress{position:relative;width:74px;height:2px;margin-top:25px;overflow:hidden;border-radius:99px;background:rgba(255,255,255,.09)}
    .wd-splash-progress::after{content:"";position:absolute;inset:0;width:34%;border-radius:inherit;background:linear-gradient(90deg,#9c7420,#f1d872);box-shadow:0 0 12px rgba(235,198,83,.36);animation:wdSplashProgress .95s ease-in-out infinite}
    .wd-splash-status{position:absolute;left:0;right:0;bottom:max(26px,calc(env(safe-area-inset-bottom) + 14px));color:#57575c;font-size:9px;font-weight:700;letter-spacing:.21em;text-transform:uppercase}
    @keyframes wdSplashEnter{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
    @keyframes wdSplashText{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
    @keyframes wdSplashAura{0%,100%{opacity:.55;transform:translate(-50%,-53%) scale(.94)}50%{opacity:1;transform:translate(-50%,-53%) scale(1.05)}}
    @keyframes wdSplashShine{0%,24%{left:-78%;opacity:0}42%{opacity:.8}72%,100%{left:132%;opacity:0}}
    @keyframes wdSplashProgress{0%{transform:translateX(-120%)}50%{transform:translateX(96%)}100%{transform:translateX(320%)}}
    @media(max-height:650px){.spa-loader-box{min-height:350px}.wd-splash-mark{width:138px}.wd-splash-brand{margin-top:23px}.wd-splash-status{display:none}}
    @media(prefers-reduced-motion:reduce){.wd-splash-mark,.wd-splash-brand,.wd-splash-subtitle,.spa-loader::before,.wd-splash-mark::after,.wd-splash-progress::after{animation:none!important}}
  </style>
