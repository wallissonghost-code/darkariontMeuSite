<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Registrar compra - WD Founder</title><link rel="stylesheet" href="premium.css?v=20260730-2120"><style>.purchase-page{max-width:760px;margin:0 auto}.quick-card{margin-top:28px;padding:30px;border-radius:30px;background:#fffdf8;border:1px solid var(--line);box-shadow:var(--shadow)}.quick-card h1{margin:0 0 10px;font-size:clamp(34px,6vw,56px)}.quick-card p{color:var(--muted);line-height:1.6}.quick-card label{display:block;font-weight:900;margin:22px 0 8px}.quick-card select,.quick-card input{width:100%;padding:17px;border:1px solid var(--line);border-radius:16px;background:#fff;font:inherit}.client-box{margin-top:16px;padding:18px;border-radius:18px;background:#f3ede1;border:1px solid var(--line)}.client-box strong,.client-box span{display:block}.client-box span{margin-top:6px;color:var(--muted);word-break:break-word}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.preview div{padding:16px;border-radius:16px;background:#f8f3ea;border:1px solid var(--line)}.preview span,.preview strong{display:block}.preview span{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.preview strong{margin-top:8px;font-size:20px}.submit{width:100%;margin-top:22px;padding:17px;border:0;border-radius:16px;background:linear-gradient(135deg,#e2bc53,#a87812);color:#17120a;font-weight:950;font-size:16px}.status{margin-top:16px;font-weight:850;color:#8c6817}@media(max-width:600px){.quick-card{padding:24px}.preview{grid-template-columns:1fr}}</style></head><body data-admin-page="true"><div class="painel"><aside class="menu"><div class="marca"><h2>WD</h2><p>FOUNDER</p></div><a href="home.html">Início</a><a href="cartao.html">Meu Cartão</a><a href="ofertas.html">Benefícios</a><a href="perfil.html">Perfil</a><button class="logout-btn" type="button">Sair</button></aside><main class="conteudo"><section class="purchase-page"><span class="eyebrow">VENDA RÁPIDA</span><div class="quick-card"><h1>Registrar compra</h1><p>Selecione o cliente, informe o valor e confira o resultado antes de lançar.</p><label for="quickClient">Cliente</label><select id="quickClient"><option>Carregando clientes...</option></select><div class="client-box" id="quickClientSummary"><span>Selecione um cliente.</span></div><label for="quickValue">Valor da compra</label><input id="quickValue" inputmode="decimal" placeholder="Ex.: 240,00"><div class="preview"><div><span>Carimbos gerados</span><strong id="previewStamps">0</strong></div><div><span>Nível atual</span><strong id="previewCurrent">—</strong></div><div><span>Nível depois</span><strong id="previewAfter">—</strong></div></div><button class="submit" id="quickSubmit" type="button">Registrar compra</button><div class="status" id="quickStatus"></div></div></section></main></div><script type="module" src="app-shell.js?v=20260730-2120"></script><script type="module" src="registrar-compra.js?v=20260730-2120"></script></body></html>
